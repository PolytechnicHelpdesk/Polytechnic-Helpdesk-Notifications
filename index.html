<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polytechnic Helpdesk Notification Portal</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">
          <img src="logo.png" alt="Polytechnic Helpdesk logo">
        </span>
        <div class="brand-text">
          <h1>Polytechnic Helpdesk</h1>
          <p>Notification Portal</p>
        </div>
      </div>
      <div class="live-clock" id="liveClock" aria-live="polite"></div>
    </div>
  </header>

  <main class="page">

    <section class="panel filter-panel" aria-label="Filters">
      <div class="field search-field">
        <label for="searchInput">Search</label>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search notifications&hellip;" autocomplete="off">
          <ul class="search-suggestions" id="searchSuggestions" hidden></ul>
        </div>
      </div>
      <div class="field">
        <label for="categoryFilter">Category</label>
        <select id="categoryFilter">
          <option value="">All Categories</option>
        </select>
      </div>
      <div class="field">
        <label for="yearFilter">Year</label>
        <select id="yearFilter">
          <option value="">All Years</option>
        </select>
      </div>
      <button id="resetFilters" class="btn-primary" type="button">Reset</button>
    </section>

    <p class="result-count"><span id="resultCount">0</span> notification(s) available</p>

    <section class="panel table-panel">
      <div class="table-controls">
        <div class="entries-control">
          <label for="pageSize">Show</label>
          <select id="pageSize">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
          </select>
          <span>entries</span>
        </div>
      </div>

      <div class="table-scroll">
        <table id="notificationTable">
          <thead>
            <tr>
              <th data-key="slNo" class="sortable col-sl">Sl. No <span class="sort-ico"></span></th>
              <th data-key="title" class="sortable col-title">Notification Title <span class="sort-ico"></span></th>
              <th data-key="category" class="sortable col-category">Category <span class="sort-ico"></span></th>
              <th data-key="isoDate" class="sortable col-date">Date Published <span class="sort-ico"></span></th>
              <th class="col-flags">Tags</th>
              <th class="col-link">Link</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- rows injected by script.js -->
          </tbody>
        </table>
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <p>No notifications match your filters.</p>
        <button id="emptyReset" class="btn-ghost" type="button">Clear filters</button>
      </div>

      <div class="table-footer">
        <p id="showingText" class="showing-text"></p>
        <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Polytechnic Helpdesk. All Right Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
